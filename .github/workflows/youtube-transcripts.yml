name: YouTube transcripts

on:
  push:
    paths:
      - '.github/workflows/youtube-transcripts.yml'
  workflow_dispatch:

jobs:
  transcripts:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch transcripts through hosted API
        shell: bash
        run: |
          set -u
          mkdir -p transcripts raw

          echo 'Getting youtube2text demo key...'
          KEY_JSON=$(curl -fsS 'https://youtube2text.org/api/demo-key')
          KEY=$(python -c 'import json,sys; print(json.load(sys.stdin)["apiKey"])' <<< "$KEY_JSON")
          echo "Demo key acquired"

          for id in MbteRhB3rRM pPP1TAemGuw wwAujcCrMfA txZ_lxFLW2I eXPreHDXi94; do
            echo "Fetching $id"
            URL="https://www.youtube.com/watch?v=${id}"

            # First try the simple no-key text endpoint.
            if curl -fLsS --max-time 90 "https://youtube-transcript.ai/transcript/${id}.txt" -o "raw/${id}.simple.txt"; then
              if [ $(wc -c < "raw/${id}.simple.txt") -gt 200 ] && ! grep -qiE 'cache miss|error|transcript unavailable' "raw/${id}.simple.txt"; then
                cp "raw/${id}.simple.txt" "transcripts/${id}.txt"
                echo "OK simple endpoint $id"
                continue
              fi
            fi

            # Hosted API that handles YouTube-facing anti-bot logic server-side.
            HTTP=$(curl -sS --max-time 120 -w '%{http_code}' -G 'https://youtube2text.org/api/transcribe' \
              --data-urlencode "url=${URL}" \
              --data-urlencode 'maxChars=150000' \
              -H "x-api-key: ${KEY}" \
              -o "raw/${id}.json")
            echo "youtube2text HTTP $HTTP for $id"

            python - "$id" <<'PY'
          import json, sys
          from pathlib import Path
          vid = sys.argv[1]
          p = Path('raw') / f'{vid}.json'
          out = Path('transcripts') / f'{vid}.txt'
          err = Path('transcripts') / f'{vid}.error.txt'
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              result = data.get('result') or {}
              content = result.get('content') or ''
              if content.strip():
                  header = (
                      f"# video_id: {result.get('videoId', vid)}\n"
                      f"# title: {result.get('title', '')}\n"
                      f"# pubDate: {result.get('pubDate', '')}\n"
                      f"# contentSize: {result.get('contentSize', len(content))}\n"
                      f"# truncated: {result.get('truncated', False)}\n\n"
                  )
                  out.write_text(header + content, encoding='utf-8')
                  print('OK youtube2text', vid, len(content))
              else:
                  err.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('FAIL youtube2text', vid, data)
          except Exception as e:
              err.write_text(f'{type(e).__name__}: {e}\n' + (p.read_text(encoding='utf-8', errors='replace') if p.exists() else ''), encoding='utf-8')
              print('FAIL parse', vid, repr(e))
          PY
          done

          echo 'RESULTS:'
          ls -lah transcripts

      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcripts-hosted
          path: transcripts/
          if-no-files-found: error

